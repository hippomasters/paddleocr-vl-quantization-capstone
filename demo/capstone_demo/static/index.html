<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaddleOCR-VL Quantization Demo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div>
    <h1>PaddleOCR-VL-1.6 on one 8 GB GPU</h1>
    <p class="sub">BF16 → GPTQ W8A16 → GPTQ W4A16, run one after another on the same page</p>
  </div>
  <div id="host-status" class="pill">Checking host…</div>
</header>

<main>
  <section class="panel" id="controls">
    <label class="drop" for="file">
      <input id="file" type="file" accept="image/png,image/jpeg,application/pdf">
      <span id="file-label">Choose a page (PNG, JPEG or single-page PDF)</span>
    </label>
    <button id="run" type="button" disabled>Run all three</button>
    <select id="history" aria-label="Load a stored run"><option value="">Stored runs…</option></select>
    <p id="message" class="message" role="status"></p>
  </section>

  <section class="panel" id="summary" hidden>
    <div class="summary-head">
      <div class="preview"><img id="preview" alt="Input page"><p id="preview-note" class="muted"></p></div>
      <div class="chart">
        <h2>Page latency (warm, c=1)</h2>
        <div id="bars"></div>
        <p id="settings" class="muted small"></p>
      </div>
    </div>
  </section>

  <section id="columns" class="columns"></section>

  <footer>
    <p id="adapter-note" class="muted small"></p>
  </footer>
</main>
<script src="/app.js"></script>
</body>
</html>
